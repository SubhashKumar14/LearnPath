<!DOCTYPE html>
<html>
<head>
    <title>Certificate Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { background: #ffe6e6; }
        .success { background: #e6ffe6; }
        button { margin: 5px; padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>Certificate System Debug</h1>
    
    <div>
        <button onclick="login()">1. Login</button>
        <button onclick="getCourses()">2. Get Courses</button>
        <button onclick="completeAllTasks()">3. Complete All Tasks</button>
        <button onclick="generateCert()">4. Generate Certificate</button>
        <button onclick="getCertificates()">5. Get Certificates</button>
    </div>

    <div id="results"></div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let courses = [];
        let certificates = [];
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }

        async function login() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'user@example.com', password: 'password123' })
                });
                const data = await response.json();
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    log(`Login successful. Token: ${authToken.substring(0, 20)}...`, 'success');
                } else {
                    log(`Login failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`Login error: ${error.message}`, 'error');
            }
        }

        async function getCourses() {
            try {
                const response = await fetch('/api/courses', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                if (response.ok) {
                    courses = data;
                    log(`Found ${courses.length} courses: ${courses.map(c => c.title).join(', ')}`, 'success');
                } else {
                    log(`Get courses failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`Get courses error: ${error.message}`, 'error');
            }
        }

        async function completeAllTasks() {
            if (!courses.length) {
                log('No courses loaded. Get courses first.', 'error');
                return;
            }
            
            try {
                const courseId = courses[0].id;
                log(`Completing all tasks for course: ${courses[0].title}`);
                
                // Get course details with tasks
                const response = await fetch(`/api/courses/${courseId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const courseData = await response.json();
                
                if (response.ok) {
                    let totalTasks = 0;
                    for (const module of courseData.modules) {
                        for (const task of module.tasks) {
                            totalTasks++;
                            // Complete this task
                            const completeResponse = await fetch('/api/progress/complete-task', {
                                method: 'POST',
                                headers: { 
                                    'Authorization': `Bearer ${authToken}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ taskId: task.id })
                            });
                            const completeData = await completeResponse.json();
                            if (!completeResponse.ok) {
                                log(`Failed to complete task ${task.id}: ${completeData.error}`, 'error');
                            }
                        }
                    }
                    log(`Attempted to complete ${totalTasks} tasks`, 'success');
                } else {
                    log(`Failed to get course details: ${courseData.error}`, 'error');
                }
            } catch (error) {
                log(`Complete tasks error: ${error.message}`, 'error');
            }
        }

        async function generateCert() {
            if (!courses.length) {
                log('No courses loaded. Get courses first.', 'error');
                return;
            }
            
            try {
                const courseId = courses[0].id;
                const response = await fetch(`/api/courses/${courseId}/certificate`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                if (response.ok) {
                    log(`Certificate generated: ${data.certificateId}`, 'success');
                    log(`Certificate URL: /certificate.html?id=${data.certificateId}`, 'success');
                } else {
                    log(`Certificate generation failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`Certificate generation error: ${error.message}`, 'error');
            }
        }

        async function getCertificates() {
            try {
                const response = await fetch('/api/certificates', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                if (response.ok) {
                    certificates = data;
                    log(`Found ${certificates.length} certificates:`, 'success');
                    certificates.forEach(cert => {
                        log(`- ${cert.course_title} (ID: ${cert.certificate_id})`, 'info');
                    });
                } else {
                    log(`Get certificates failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`Get certificates error: ${error.message}`, 'error');
            }
        }

        // Auto-populate token if available
        if (authToken) {
            log(`Using stored token: ${authToken.substring(0, 20)}...`, 'info');
        }
    </script>
</body>
</html>
